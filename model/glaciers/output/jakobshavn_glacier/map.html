<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jakobshavn Glacier motion, Greenland</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map {height:100%;margin:0}
.ctl {
 position:absolute;z-index:1000;bottom:24px;left:12px;
 background:white;padding:10px;border-radius:6px;
 font:13px sans-serif;max-width:330px
}
</style>
</head>
<body>
<div id="map"></div>
<div class="ctl">
<b>Jakobshavn Glacier motion, Greenland</b><p>
NISAR GOFF + GCOV<br>
GOFF: radar-projected motion (m/day).<br>
GCOV: HH radar backscatter changes (dB).<br>
Backscatter changes do not directly indicate glacier retreat.<br>
Quality thresholds are provisional.
</p>
Opacity
<input id="op" type="range" min="0" max="1"
 step="0.05" value="0.8">
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const B = [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]];
const BBOX = [-50.6, 68.9, -49.2, 69.4];
const LAYERS = [["Ascending | June 2026 | along (m/day)", "map/00.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Ascending | June 2026 | slant (m/day)", "map/01.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Ascending | June 2026 | quality coverage", "map/02.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Ascending | October 2026 | along (m/day)", "map/03.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Ascending | October 2026 | slant (m/day)", "map/04.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Ascending | October 2026 | quality coverage", "map/05.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Ascending | October - June | along (m/day)", "map/06.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Ascending | October - June | slant (m/day)", "map/07.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Descending | June 2026 | along (m/day)", "map/08.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Descending | June 2026 | slant (m/day)", "map/09.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Descending | June 2026 | quality coverage", "map/10.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Descending | October 2026 | along (m/day)", "map/11.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Descending | October 2026 | slant (m/day)", "map/12.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Descending | October 2026 | quality coverage", "map/13.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Descending | October - June | along (m/day)", "map/14.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["Descending | October - June | slant (m/day)", "map/15.png", [[68.85752925502915, -50.73738637691436], [69.44166014160535, -49.09911495100715]]], ["GCOV | June 2026 | HH backscatter (dB)", "map/16.png", [[68.85725385688158, -50.737715320189906], [69.4419344434552, -49.09881443218958]]], ["GCOV | October 2026 | HH backscatter (dB)", "map/17.png", [[68.85725385688158, -50.737715320189906], [69.4419344434552, -49.09881443218958]]], ["GCOV | October - June | HH change (dB)", "map/18.png", [[68.85725385688158, -50.737715320189906], [69.4419344434552, -49.09881443218958]]], ["GCOV | Backscatter increase >= 3 dB", "map/19.png", [[68.85725385688158, -50.737715320189906], [69.4419344434552, -49.09881443218958]]], ["GCOV | Backscatter decrease <= -3 dB", "map/20.png", [[68.85725385688158, -50.737715320189906], [69.4419344434552, -49.09881443218958]]]];
const DEFAULT = ["Ascending | October - June | along (m/day)", "GCOV | October - June | HH change (dB)"];

const sat = L.tileLayer(
 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
 {maxZoom:18,attribution:'Tiles &copy; Esri'}
);
const osm = L.tileLayer(
 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
 {maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}
);

const map = L.map('map',{layers:[sat]}).fitBounds(B);
const overlays = {};

LAYERS.forEach(([label,src,layerBounds],i) => {
  overlays[label] = L.imageOverlay(src,layerBounds,{
    opacity:0.8,
    zIndex:10+i
  });

  if(DEFAULT.includes(label)) {
    overlays[label].addTo(map);
  }
});

L.control.layers(
 {'Esri satellite':sat,'OpenStreetMap':osm},
 overlays,
 {collapsed:false}
).addTo(map);

L.rectangle(
 [[BBOX[1],BBOX[0]],[BBOX[3],BBOX[2]]],
 {color:'#ffff00',weight:1,fill:false}
).addTo(map);

document.getElementById('op').oninput = e =>
 Object.values(overlays).forEach(
   layer => layer.setOpacity(+e.target.value)
 );

map.on('click', e =>
 L.popup().setLatLng(e.latlng)
 .setContent(
   e.latlng.lat.toFixed(5)+', '+
   e.latlng.lng.toFixed(5)
 ).openOn(map)
);
</script>
</body>
</html>
