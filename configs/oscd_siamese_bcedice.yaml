# "Paper" setup: Siamese U-Net, RGB+NIR, BCE+Dice, cosine LR, change-positive 96px crops, flips
experiment: oscd
data:
  bands: [B04, B03, B02, B08]
  patch_size: 96
  train_sampling: change_positive
  val_positive_only: true
model: {name: siamese_unet, base_channels: 16}
loss: {name: bce_dice, bce_weight: 0.5}
optim: {lr: 0.0001, weight_decay: 0.0001, scheduler: cosine, t_max: 80}
trainer: {patience: 30}
logging: {tags: [siamese, rgbn, bce-dice]}
tune: {study_name: oscd_bcedice}
