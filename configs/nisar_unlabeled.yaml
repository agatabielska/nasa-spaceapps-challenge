# NISAR without ground truth: use prepare_nisar.py + visualize.py nisar (EDA + log-ratio baseline).
experiment: nisar
data:
  name: nisar
  patch_size: 256
  batch_size: 8
  num_workers: 2
  nisar:
    # Keep in acquisition order (earliest = T1, latest = T2).
    granules:
      # - NISAR_L2_PR_GCOV_024_043_A_002_2005_DHDH_A_20260629T035753_20260629T035828_P05023_N_F_J_001
      # - NISAR_L2_PR_GCOV_032_043_A_002_2005_DHDH_A_20261003T035750_20261003T035825_P05023_N_F_J_001

      - NISAR_L2_PR_GCOV_025_087_A_022_2005_DHDH_A_20260714T052401_20260714T052434_P05023_F_F_J_001
      - NISAR_L2_PR_GCOV_028_087_A_022_2005_DHDH_A_20260819T052400_20260819T052432_P05023_N_F_J_001
    # Full downloaded scene; set a bbox in EPSG:32630 after selecting the fire area.
    bbox: null
    label_path: null
model: {name: siamese_unet, base_channels: 32}
loss: {name: bce_dice}
logging: {project: nisar-change-detection}
