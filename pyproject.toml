[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdet"
version = "0.1.0"
description = "Change detection on satellite imagery: OSCD (optical) and NISAR (SAR)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "pytorch-lightning>=2.2",
    "torchmetrics>=1.3",
    "optuna>=3.5",
    "wandb>=0.17",
    "rasterio",
    "matplotlib",
    "omegaconf>=2.3",
    "tqdm",
]

[project.optional-dependencies]
nisar = ["asf_search", "h5py", "python-dotenv"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
